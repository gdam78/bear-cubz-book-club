<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 Bear Cubz Book Club</title>
<meta name="description" content="Recommend a book, browse the Bear Cubz library, or roll a discussion question.">
<meta property="og:title" content="📚 Bear Cubz Book Club">
<meta property="og:description" content="Recommend a book, browse the library, or roll a discussion question.">
<meta property="og:image" content="https://gdam78.github.io/bear-cubz-book-club/preview.png">
<style>
*{box-sizing:border-box}
body{margin:0;padding:24px 16px 40px;background:linear-gradient(145deg,#f8efe5,#eee5f3);color:#25202a;font-family:system-ui,sans-serif}
.wrap{max-width:720px;margin:auto}header{text-align:center;padding:20px}.bear{font-size:46px}
h1{margin:4px 0 8px;font-size:clamp(30px,7vw,48px)}.tagline{opacity:.7}
.card{background:#fffefaee;border-radius:24px;padding:22px;margin:16px 0;box-shadow:0 10px 28px #3223321f}
h2{margin:0 0 14px}.buttons,.grid{display:grid;gap:12px}.grid{grid-template-columns:1fr 1fr}
a,button{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font:inherit;font-weight:750;text-align:center;text-decoration:none;cursor:pointer}
a.primary,button{background:#6f3f72;color:white}a.secondary,button.cat{background:#eee6f1;color:#25202a}
button.cat{min-height:64px}button:disabled{opacity:.65;cursor:wait}
#box{display:none;margin-top:20px;text-align:center}
#category{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;opacity:.62;margin-bottom:12px}
#shape{position:relative;margin:0 auto 18px;width:min(100%,520px);height:330px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:24px;background:#fffaf2;border:2px solid #eadce8;box-shadow:inset 0 0 0 999px rgba(255,250,242,.32),0 10px 18px #3223321c}
#shape::before{content:"";position:absolute;inset:10px;background-image:var(--icon);background-repeat:no-repeat;background-position:center;background-size:72%;opacity:.16;filter:grayscale(1) saturate(0);transform:scale(1.04);z-index:0}
#shape::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at center,rgba(255,250,242,.76) 0 28%,rgba(255,250,242,.30) 58%,rgba(255,250,242,0) 78%);z-index:0;pointer-events:none}
#question{position:relative;z-index:1;width:min(72%,360px);font-size:clamp(20px,4.5vw,27px);line-height:1.25;font-weight:750;text-wrap:balance}
#shape.rolling::before{animation:spinfade .28s infinite alternate}
#shape.rolling #question{animation:jitter .10s infinite alternate}
@keyframes spinfade{from{transform:scale(.94) rotate(-2deg);opacity:.08}to{transform:scale(1.06) rotate(2deg);opacity:.22}}
@keyframes jitter{from{transform:translateX(-3px)}to{transform:translateX(3px)}}
#again{max-width:330px;margin:auto}
.tiny{text-align:center;font-size:13px;opacity:.55}
@media(max-width:430px){.grid{grid-template-columns:1fr}#shape{height:290px}#question{width:70%;font-size:20px}}
</style>
</head>
<body><div class="wrap">
<header><div class="bear">🐻</div><h1>BEAR CUBZ BOOK CLUB</h1><p class="tagline">Pick a book. Make a case. Read something interesting.</p></header>
<section class="card"><h2>📚 Library</h2><div class="buttons">
<a class="primary" href="https://airtable.com/appfTnxXaMgTarggJ/pagdBtbKG3EhMdstE/form">📖 Recommend a Book</a>
<a class="secondary" href="https://airtable.com/appfTnxXaMgTarggJ/shrBCnM3iUQdKo5Ht">📚 Browse the Library</a>
</div></section>
<section class="card"><h2>🎲 Question Roulette</h2><p>Pick a category. Get a random question.</p>
<div class="grid">
<button class="cat" onclick="roll('🐟 Fishbowl','fish','https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1F41F.svg')">🐟 Fishbowl</button>
<button class="cat" onclick="roll('🔥 Hot Take','hot','https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1F525.svg')">🔥 Hot Take</button>
<button class="cat" onclick="roll('🛡️ Defend It','defend','https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1F6E1-FE0F.svg')">🛡️ Defend It</button>
<button class="cat" onclick="roll('🧠 Deep Dive','deep','https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1F9E0.svg')">🧠 Deep Dive</button>
<button class="cat" onclick="roll('🔖 Back to the Book','back','https://cdn.jsdelivr.net/gh/hfg-gmuend/openmoji/color/svg/1F516.svg')">🔖 Back to the Book</button>
</div>
<div id="box"><div id="category"></div><div id="shape"><div id="question"></div></div><button id="again" onclick="again()">🎲 Another One</button></div>
</section><p class="tiny">Made for the Bear Cubz 🐻<br>Artwork: OpenMoji, CC BY-SA 4.0</p>
</div>
<script>
const Q={"fish": ["What did you like most about the book?", "What did you like least?", "Who was your favorite character?", "Who annoyed you the most?", "What character surprised you?", "What scene stuck with you?", "What scene made you laugh?", "What scene made you uncomfortable?", "What was your favorite moment?", "What was the weakest moment?", "What confused you?", "What would you change?", "Which character would you want to meet?", "Which character would you avoid?", "Which character would you hook up with?", "Which character would you absolutely not hook up with?", "Which character would make the best boyfriend?", "Which character would make the worst boyfriend?", "What character would you trust with your deepest secret?", "Would you recommend this book?"], "hot": ["Who is the hottest character, and why?", "Which character would you swipe right on?", "Which character would you block immediately?", "Which character would you let ruin your life?", "Which character is the biggest red flag?", "Which character is the biggest green flag?", "Who has the worst taste in men?", "Who would make the worst boyfriend?", "Who would make the best boyfriend?", "Which relationship has the best sexual tension?", "Which relationship has absolutely no chemistry?", "Did the romance actually work?", "Did the book give us enough romance?", "Did the book give us too much romance?", "Who should have fucked and gotten it over with?", "Who deserved a better love interest?", "What did the author get completely wrong?", "Where did the author chicken out?", "What opinion about this book would get you booed out of the room?", "What is your most controversial opinion about this book?"], "defend": ["Who is the most misunderstood character?", "Who deserves redemption?", "Who deserves condemnation?", "Which character's worst decision can you defend?", "Which character's worst decision is indefensible?", "Can you defend the villain?", "Can you defend the protagonist?", "Can you make the case that the ending was perfect?", "Can you make the case that the ending was terrible?", "Which character deserves more sympathy?", "Which character deserves less sympathy?", "Can you convince us your favorite scene is the best scene?", "Which character would you remove from the book?", "Which character would you add to the book?", "Can you make the case that the romance was necessary?", "Can you make the case that the romance wasn't necessary?", "Can you argue that the book is actually about something completely different?", "Can you make the strongest argument against your own opinion?", "Which unpopular opinion about this book could you successfully defend?", "Can you convince us to read another book by this author?"], "deep": ["What is this book actually trying to say?", "What does the protagonist want?", "What does the protagonist actually need?", "How does the protagonist change?", "Does the protagonist actually change?", "Who has the most power in the story?", "How does the setting affect the story?", "What role does identity play in the story?", "What does the book say about love?", "What does the book say about friendship?", "What does the book say about family?", "What does the book say about masculinity?", "What does the book say about sexuality?", "What does the book say about belonging?", "What does the author leave unsaid?", "Which character is most misunderstood?", "What contradiction sits at the center of the story?", "What theme becomes clearer after finishing the book?", "What does the book ask us to forgive?", "What question does the book leave unresolved?"], "back": ["What have we established?", "What do we disagree about?", "What haven't we discussed yet?", "What question is still bothering you?", "Where does the book actually support that?", "What happened next?", "What are we missing?", "What does the text actually say?", "Who can point us to the scene we're talking about?", "Are we talking about the book or our own interpretation?", "What evidence supports that?", "What evidence contradicts that?"]};
let list=null,last=-1,currentName="",currentIcon="";
function choose(a){let i;do{i=Math.floor(Math.random()*a.length)}while(a.length>1&&i===last);last=i;return a[i]}
function roll(name,key,icon){
list=Q[key];last=-1;currentName=name;currentIcon=icon;
document.getElementById("box").style.display="block";
document.getElementById("category").textContent=name;
const s=document.getElementById("shape");s.style.setProperty("--icon","url('"+icon+"')");
s.className="rolling";document.getElementById("question").textContent="Rolling…";
const btn=document.getElementById("again");btn.disabled=true;
let count=0;const timer=setInterval(()=>{document.getElementById("question").textContent=list[Math.floor(Math.random()*list.length)];count++;if(count>=10){clearInterval(timer);document.getElementById("question").textContent=choose(list);s.className="";btn.disabled=false}},95);
document.getElementById("box").scrollIntoView({behavior:"smooth",block:"nearest"});
}
function again(){if(list)roll(currentName,Object.keys(Q).find(k=>Q[k]===list),currentIcon)}
</script></body></html>
